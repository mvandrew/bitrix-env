# GitHub Actions workflow for building and pushing PHP 8.2 Apache Docker image
# Repository: github.com/mvandrew/bitrix-env
#
# This workflow builds the PHP 8.2 Apache image optimized for 1C-Bitrix
# and pushes it to Docker Hub as msav/bitrix-php-apache:8.2 and :latest
#
# Note: This is a multi-stage build that compiles many PHP extensions,
# so it takes longer to build than simple images (up to 30-60 minutes)
#
# Required secrets:
#   - DOCKERHUB_USERNAME: Docker Hub username
#   - DOCKERHUB_TOKEN: Docker Hub access token

name: Build and Push PHP 8.2 Apache

on:
  # Manual trigger via GitHub UI or API
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before push'
        required: false
        default: false
        type: boolean

  # Automatic trigger on push to master branch or version tags.
  # Conditional build logic is handled by the detect job below.
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  IMAGE_NAME: msav/bitrix-php-apache
  TAG: "8.2"
  TEST_CONTAINER_NAME: php-apache-8.2-test
  TEST_PORT: 8889

jobs:
  # Gate job: decide whether a build is required for this event.
  # Build runs only when one of the following is true:
  #   - manual dispatch or a version tag (v*) is pushed
  #   - the commit message contains "#all" or the per-image tag "#php-apache-8.2"
  #   - related image files changed in the pushed diff
  # Commit message is passed via env (never interpolated into run) to avoid shell injection.
  detect:
    name: Detect build conditions
    runs-on: self-hosted
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          should_build=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ]; then
            echo "Manual dispatch or version tag -> build."
            should_build=true
          else
            if printf '%s' "$COMMIT_MSG" | grep -qE '#all([^[:alnum:]]|$)'; then
              echo "#all tag -> build."
              should_build=true
            fi
            if printf '%s' "$COMMIT_MSG" | grep -qF '#php-apache-8.2'; then
              echo "#php-apache-8.2 tag -> build."
              should_build=true
            fi
            if [ "$should_build" != "true" ]; then
              zero_sha="0000000000000000000000000000000000000000"
              base=""
              if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$zero_sha" ] \
                 && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
                base="$BEFORE_SHA"
              elif git rev-parse --verify --quiet "HEAD~1" >/dev/null; then
                base="HEAD~1"
              fi
              if [ -z "$base" ]; then
                echo "No usable diff base -> build (safe default)."
                should_build=true
              else
                changed=$(git diff --name-only "$base" HEAD || true)
                echo "Changed files:"; echo "$changed"
                if echo "$changed" | grep -qE '^(images/php-apache/(8\.2|base)/|\.github/workflows/build-php-apache-8\.2\.yml$)'; then
                  echo "Related paths changed -> build."
                  should_build=true
                fi
              fi
            fi
          fi

          echo "should_build=$should_build"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-test-push:
    needs: detect
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    name: Build, Test and Push PHP 8.2 Apache
    runs-on: self-hosted
    timeout-minutes: 60  # Multi-stage build takes longer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: images/php-apache
        run: |
          echo "Building ${{ env.IMAGE_NAME }}:${{ env.TAG }}..."
          echo "Note: Multi-stage build may take 20-40 minutes"
          # Проверяем обновления базовых образов в registry при каждой сборке.
          docker build --pull --rm -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} -f 8.2/Dockerfile .
          echo "Build completed successfully"

      - name: Test PHP image
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          bash images/php-apache/base/scripts/test-image.sh \
            "${{ env.IMAGE_NAME }}:${{ env.TAG }}" "${{ env.TAG }}" \
            "${{ env.TEST_PORT }}" "${{ env.TEST_CONTAINER_NAME }}"

      - name: Tag as latest
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.IMAGE_NAME }}:latest

      - name: Push to Docker Hub
        run: |
          echo "Pushing ${{ env.IMAGE_NAME }}:${{ env.TAG }} to Docker Hub..."
          docker push ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          echo "Pushing ${{ env.IMAGE_NAME }}:latest to Docker Hub..."
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "Push completed successfully"

      - name: Image info
        run: |
          echo ""
          echo "=== Images Published ==="
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          echo "Image: ${{ env.IMAGE_NAME }}:latest"
          echo "Pull command: docker pull ${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          echo ""
          echo "Included PHP extensions:"
          echo "  Core: mysqli, pdo_mysql, gd, mbstring, curl, xml, zip, opcache"
          echo "  Cache: redis, memcached, memcache"
          echo "  Network: ftp, sodium, ldap, imap"
          echo "  Compression: lz4, zstd, lzf, bz2"
          echo "  Messaging: amqp, rdkafka"
          echo "  Other: imagick, mcrypt, xlswriter, rrd"
          echo ""
