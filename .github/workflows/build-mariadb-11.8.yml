# GitHub Actions workflow for building and pushing MariaDB 11.8 LTS Docker image
# Repository: github.com/mvandrew/bitrix-env
#
# This workflow builds the MariaDB 11.8 LTS image optimized for 1C-Bitrix
# and pushes it to Docker Hub as msav/bitrix-mariadb:11.8 and :latest
#
# Required secrets:
#   - DOCKERHUB_USERNAME: Docker Hub username
#   - DOCKERHUB_TOKEN: Docker Hub access token

name: Build and Push MariaDB 11.8

on:
  # Manual trigger via GitHub UI or API
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before push'
        required: false
        default: false
        type: boolean

  # Automatic trigger on push to master branch or version tags.
  # Conditional build logic is handled by the detect job below.
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  IMAGE_NAME: msav/bitrix-mariadb
  TAG: "11.8"
  TEST_CONTAINER_NAME: mariadb-11.8-test

jobs:
  # Gate job: decide whether a build is required for this event.
  # Build runs only when one of the following is true:
  #   - manual dispatch or a version tag (v*) is pushed
  #   - the commit message contains "#all" or the per-image tag "#mariadb-11.8"
  #   - related image files changed in the pushed diff
  # Commit message is passed via env (never interpolated into run) to avoid shell injection.
  detect:
    name: Detect build conditions
    runs-on: self-hosted
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          should_build=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$REF_TYPE" = "tag" ]; then
            echo "Manual dispatch or version tag -> build."
            should_build=true
          else
            if printf '%s' "$COMMIT_MSG" | grep -qE '#all([^[:alnum:]]|$)'; then
              echo "#all tag -> build."
              should_build=true
            fi
            if printf '%s' "$COMMIT_MSG" | grep -qF '#mariadb-11.8'; then
              echo "#mariadb-11.8 tag -> build."
              should_build=true
            fi
            if [ "$should_build" != "true" ]; then
              zero_sha="0000000000000000000000000000000000000000"
              base=""
              if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "$zero_sha" ] \
                 && git rev-parse --verify --quiet "${BEFORE_SHA}^{commit}" >/dev/null; then
                base="$BEFORE_SHA"
              elif git rev-parse --verify --quiet "HEAD~1" >/dev/null; then
                base="HEAD~1"
              fi
              if [ -z "$base" ]; then
                echo "No usable diff base -> build (safe default)."
                should_build=true
              else
                changed=$(git diff --name-only "$base" HEAD || true)
                echo "Changed files:"; echo "$changed"
                if echo "$changed" | grep -qE '^images/mariadb/(11\.8|base)/'; then
                  echo "Related paths changed -> build."
                  should_build=true
                fi
              fi
            fi
          fi

          echo "should_build=$should_build"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-test-push:
    needs: detect
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    name: Build, Test and Push MariaDB 11.8
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        working-directory: images/mariadb
        run: |
          echo "Building ${{ env.IMAGE_NAME }}:${{ env.TAG }}..."
          docker build --rm -t ${{ env.IMAGE_NAME }}:${{ env.TAG }} -f 11.8/Dockerfile .
          echo "Build completed successfully"

      - name: Test MariaDB image
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: |
          echo "=== Testing MariaDB 11.8 image ==="
          echo ""

          echo "1. Starting test container..."
          docker run --rm -d --name ${{ env.TEST_CONTAINER_NAME }} \
            -e MYSQL_ROOT_PASSWORD=testpwd \
            -e MYSQL_DATABASE=bitrix_test \
            ${{ env.IMAGE_NAME }}:${{ env.TAG }}

          echo "   Waiting for MariaDB to initialize (45s)..."
          sleep 45

          echo ""
          echo "2. Checking MariaDB version:"
          docker exec ${{ env.TEST_CONTAINER_NAME }} mariadb -uroot -ptestpwd -e "SELECT VERSION();" 2>/dev/null

          echo ""
          echo "3. Checking sql_mode (must be empty for Bitrix):"
          docker exec ${{ env.TEST_CONTAINER_NAME }} mariadb -uroot -ptestpwd -e "SHOW VARIABLES LIKE 'sql_mode';" 2>/dev/null

          echo ""
          echo "4. Checking character_set_server (must be utf8mb4):"
          docker exec ${{ env.TEST_CONTAINER_NAME }} mariadb -uroot -ptestpwd -e "SHOW VARIABLES LIKE 'character_set_server';" 2>/dev/null

          echo ""
          echo "5. Checking collation_server:"
          docker exec ${{ env.TEST_CONTAINER_NAME }} mariadb -uroot -ptestpwd -e "SHOW VARIABLES LIKE 'collation_server';" 2>/dev/null

          echo ""
          echo "6. Checking transaction_isolation (must be READ-COMMITTED):"
          docker exec ${{ env.TEST_CONTAINER_NAME }} mariadb -uroot -ptestpwd -e "SHOW VARIABLES LIKE 'transaction_isolation';" 2>/dev/null

          echo ""
          echo "7. Checking innodb_buffer_pool_size:"
          docker exec ${{ env.TEST_CONTAINER_NAME }} mariadb -uroot -ptestpwd -e "SHOW VARIABLES LIKE 'innodb_buffer_pool_size';" 2>/dev/null

          echo ""
          echo "8. Checking innodb_snapshot_isolation (must be OFF for Bitrix on 11.8):"
          docker exec ${{ env.TEST_CONTAINER_NAME }} mariadb -uroot -ptestpwd -e "SHOW VARIABLES LIKE 'innodb_snapshot_isolation';" 2>/dev/null

          echo ""
          echo "Stopping test container..."
          docker stop ${{ env.TEST_CONTAINER_NAME }} 2>/dev/null || true

          echo ""
          echo "=== Tests completed successfully ==="

      - name: Cleanup test container on failure
        if: failure()
        run: |
          docker stop ${{ env.TEST_CONTAINER_NAME }} 2>/dev/null || true
          docker rm ${{ env.TEST_CONTAINER_NAME }} 2>/dev/null || true

      - name: Tag as latest
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.TAG }} ${{ env.IMAGE_NAME }}:latest

      - name: Push to Docker Hub
        run: |
          echo "Pushing ${{ env.IMAGE_NAME }}:${{ env.TAG }} to Docker Hub..."
          docker push ${{ env.IMAGE_NAME }}:${{ env.TAG }}
          echo "Pushing ${{ env.IMAGE_NAME }}:latest to Docker Hub..."
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "Push completed successfully"

      - name: Image info
        run: |
          echo ""
          echo "=== Images Published ==="
          echo "Image: ${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          echo "Image: ${{ env.IMAGE_NAME }}:latest"
          echo "Pull command: docker pull ${{ env.IMAGE_NAME }}:${{ env.TAG }}"
          echo ""
